<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ef">
  <title>용어집</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div class="hero-icon" aria-hidden="true">▤</div>
      <h1>소설 용어집 추출기</h1>
      <p>소설 본문에서 고유명사를 추출하여 용어집을 자동으로 생성합니다.</p>
    </header>

    <section class="surface input-surface">
      <div class="tabs" role="tablist" aria-label="입력 방식">
        <button class="tab active" data-mode="url" type="button">URL로 가져오기</button>
        <button class="tab" data-mode="text" type="button">본문 붙여넣기</button>
      </div>

      <div id="urlPanel" class="panel active">
        <label for="url">소설 회차 주소</label>
        <input id="url" type="url" placeholder="https://example.com/chapter/1" autocomplete="url">
        <p class="hint">사이트에서 자동 수집이 막히면 본문 붙여넣기를 사용하세요.</p>
      </div>

      <div id="textPanel" class="panel">
        <label for="text">중국어 본문</label>
        <textarea id="text" rows="10" placeholder="중국어 소설 본문을 붙여넣으세요."></textarea>
      </div>

      <div class="field">
        <label for="project">작품명 <span class="label-note">(저장용)</span></label>
        <input id="project" placeholder="예: 전하, 어찌 그리 찔리십니까">
        <p class="hint">작품명을 입력하면 작품별로 용어집을 따로 저장할 수 있어요.</p>
      </div>

      <button id="extract" class="primary extract-button" type="button">
        <span class="button-icon" aria-hidden="true">✦</span>
        용어집 추출 시작
      </button>

      <div id="status" class="status" aria-live="polite"></div>
    </section>

    <details class="surface advanced">
      <summary>
        <span class="summary-icon" aria-hidden="true">⌘</span>
        API 키 및 고급 설정
      </summary>

      <div class="advanced-inner">
        <label for="apiKey">Gemini API Key</label>
        <div class="secret-field">
          <input id="apiKey" type="password" autocomplete="off" placeholder="AIza...">
          <button id="toggleApiKey" class="secondary secret-toggle" type="button">보기</button>
        </div>

        <label class="check remember-key">
          <input id="rememberApiKey" type="checkbox">
          <span>이 기기에 API 키 저장</span>
        </label>
        <p class="hint">API 키는 브라우저에서만 저장되며 GitHub 파일에는 포함되지 않습니다.</p>

        <div class="field model-field">
          <label for="model">모델 선택</label>
          <input id="model" value="gemini-2.5-flash">
        </div>

        <label class="check">
          <input id="mergeExisting" type="checkbox" checked>
          <span>같은 작품의 기존 용어집과 합치기</span>
        </label>
      </div>
    </details>

    <section class="surface library-surface">
      <div class="section-head">
        <div>
          <span class="section-kicker">저장됨</span>
          <h2>저장된 용어집</h2>
        </div>
        <button id="clear" class="text-button" type="button">전체 삭제</button>
      </div>

      <p class="library-help">추출 결과에서 <b>작품에 저장</b>을 누르면 작품별로 따로 보관됩니다.</p>
      <div id="saved" class="saved"></div>
    </section>

    <section id="resultCard" class="surface result-surface hidden">
      <div class="section-head">
        <div>
          <span class="section-kicker">추출 결과</span>
          <h2 id="resultTitle">추출된 용어집</h2>
        </div>
        <span id="count" class="count">0개</span>
      </div>

      <div class="filter-row">
        <button class="filter active" data-filter="all" type="button">전체</button>
        <button class="filter" data-filter="person" type="button">인물</button>
        <button class="filter" data-filter="place" type="button">지명·세력</button>
      </div>

      <textarea id="output" rows="17" spellcheck="false"></textarea>

      <div class="actions">
        <button id="copy" class="primary" type="button">콜로모용 복사</button>
        <button id="save" class="secondary" type="button">작품에 저장</button>
        <button id="download" class="secondary" type="button">TXT 저장</button>
      </div>

      <details class="prompt-details">
        <summary>번역 지침과 함께 복사</summary>
        <textarea id="promptBox" rows="11" readonly></textarea>
        <button id="copyPrompt" class="secondary full" type="button">용어집 + 번역 지침 복사</button>
      </details>
    </section>

    <footer class="footer-note">
      <span aria-hidden="true">▤</span>
      용어집은 이 브라우저에만 저장됩니다.
    </footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
